<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snortleblat Character Card</title>
    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Snortleblat Character Card">
    <meta property="og:description" content="A dynamic character card built with JavaScript.">
    <meta property="og:url" content="https://johnson-spencer.github.io/wdd131/charactercard/">
    <meta property="og:image" content="https://johnson-spencer.github.io/wdd131/charactercard/social-preview.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snortleblat Character Card">
    <meta name="twitter:description" content="A dynamic character card built with JavaScript.">
    <meta name="twitter:image" content="https://johnson-spencer.github.io/wdd131/charactercard/social-preview.png">

    <link rel="icon" href="character-icon.png">
    <link rel="apple-touch-icon" href="character-icon.png">
</head>


<body>
    <main>
        <section class="card">
        <img src="snortleblat.webp" alt="Character Card" class="image">
        <h1 id="character-name" class="name">Snortleblat</h1>
      <div class="stats">
    <p>Class: <span id="character-class">Swamp Beast Diplomat</span></p>
    <p>Level: <span id="character-level">8</span></p>
    <p>Health: <span id="character-health">100</span></p>

</div>

        <div class="buttons">
            <button id="attack-button">Attack</button>
            <button id="level-up-button">Level Up</button>
        </div>
        </section>
    </main>
</body>

</html>
