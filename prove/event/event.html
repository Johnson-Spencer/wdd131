<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Event Ticket</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="event.css">
  <link rel="icon" href="tickets-favicon.ico" type="image/x-icon">
  <script src="event.js" defer></script>
</head>

<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="ticketForm">
      <div class="form-grid">

        <div class="field">
          <label for="firstName">First Name</label>
          <input
            id="firstName"
            name="firstName"
            type="text"
            required
          >
        </div>

        <div class="field">
          <label for="lastName">Last Name</label>
          <input
            id="lastName"
            name="lastName"
            type="text"
            required
          >
        </div>

        <div class="field full">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
          >
        </div>

        <div class="field">
          <label for="type">Type</label>

          <select id="type" name="type" required>
            <option value="">Choose one</option>
            <option value="student">Student</option>
            <option value="guest">Guest</option>
          </select>
        </div>

        <div class="field">
          <label for="eventDate">Event Date</label>
          <input
            id="eventDate"
            name="eventDate"
            type="date"
            required
          >
        </div>

        <div id="extraField" class="field full hidden">
          <label id="extraLabel" for="extraInput"></label>

          <input
            id="extraInput"
            name="extraInput"
            type="text"
          >
        </div>

        <button class="full" type="submit">
          Create Ticket
        </button>

      </div>
    </form>

    <div id="messages"></div>

    <section id="ticketOutput" class="hidden"></section>
  </main>
</body>
</html>
